<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demandas · Servis</title>
<link rel="icon" type="image/png" href="logo-servis.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demandas.css">
<script>try{if(localStorage.getItem('backoffice_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="boot" id="boot">
  <img src="logo-servis.png" alt="" class="boot-logo">
  <div class="spin"></div>
  <div class="boot-msg" id="boot-msg">Carregando demandas...</div>
</div>

<div class="offline-bar" id="offline-bar" role="alert" hidden>
  Sem conexão com o banco de dados. Os dados exibidos podem estar desatualizados.
  <button class="btn btn-sm btn-light" onclick="App.reload(true)">Tentar novamente</button>
</div>

<aside class="side" id="side" aria-label="Menu principal">
  <div class="side-brand">
    <img src="logo-servis.png" alt="Servis">
    <div><b>Demandas</b><small>Servis Eletrônica</small></div>
    <button class="icon-btn side-close" onclick="App.toggleMenu(false)" aria-label="Fechar menu">✕</button>
  </div>
  <nav class="side-nav" id="side-nav"></nav>
  <div class="side-foot">
    <a href="index.html" class="side-back">← Voltar ao Backoffice</a>
  </div>
</aside>
<div class="side-scrim" id="side-scrim" onclick="App.toggleMenu(false)"></div>

<div class="main">
  <header class="top">
    <button class="icon-btn menu-btn" onclick="App.toggleMenu(true)" aria-label="Abrir menu">☰</button>
    <div class="top-title"><h1 id="page-title">Dashboard</h1><p id="page-sub"></p></div>
    <div class="top-search">
      <input type="search" id="global-q" placeholder="Buscar por título, código (DEM-0001) ou pessoa..." aria-label="Buscar demandas"
             onkeydown="if(event.key==='Enter'){App.globalSearch(this.value)}">
    </div>
    <button class="btn btn-primary btn-new" onclick="Tarefa.abrirForm()">+ Nova Demanda</button>
    <button class="theme-btn" onclick="temaDemandas()" title="Modo claro / escuro" aria-label="Alternar modo escuro"><svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="me-chip" id="me-chip" onclick="App.escolherUsuario()" title="Trocar usuário"></button>
  </header>
  <main class="view" id="view" tabindex="-1"></main>
</div>

<!-- Painel lateral da tarefa -->
<div class="drawer-scrim" id="drawer-scrim" onclick="Tarefa.fechar()"></div>
<aside class="drawer" id="drawer" aria-label="Detalhes da demanda" hidden></aside>

<!-- Modal genérico -->
<div class="modal-scrim" id="modal-scrim">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="dem-core.js"></script>
<script src="dem-tarefa.js"></script>
<script src="dem-paginas.js"></script>
<script src="dem-config.js"></script>
<script src="dem-relatorio.js"></script>
<script src="assistente.js"></script>
<script>
function temaDemandas(forcar) {
  const escuro = forcar !== undefined ? forcar : document.documentElement.getAttribute('data-theme') !== 'dark';
  if (escuro) document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('backoffice_theme', escuro ? 'dark' : 'light'); } catch (e) {}
  if (window.Chart) { Chart.defaults.color = escuro ? '#a9b4c7' : '#475569'; Chart.defaults.borderColor = escuro ? '#26324a' : '#e3e8ef'; }
  if (forcar === undefined && window.App && App.page) App.render();
}
temaDemandas(document.documentElement.getAttribute('data-theme') === 'dark');
App.start();
</script>
</body>
</html>
